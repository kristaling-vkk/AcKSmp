# %check_name% - nombre de la comprobación
# %description% - description of the check
# %vl% - violaciones
# %verbose% - informacion extra
# %player% - nombre del jugador
# [alert] - comando especial para alertar
# [webhook] - comando especial para alertar mediante un webhook de Discord
# [proxy] - special command to alert to other servers connected to your proxy (BungeeCord/Velocity)
Punishments:
  ProtocolBan:
    remove-violations-after: 2700
    checks:
      - "BadPacketsD"
      - "BadPacketsS"
      - "BadPacketsY"
      - "SelfInteract"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "1:0 [webhook]"
      - "1:0 [proxy]"
      - "1:0 ban %player% [GroundedGrim] Protocol violation (%check_name%)"
      - "300:0 kick %player% §c§lВы были кикнуты за подозрение в использовании читов"
